<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Restock History</title>
<style>
  :root { --bg:#fff; --fg:#1d1d1f; --muted:#6e6e73; --line:#e5e5ea; --accent:#0071e3; --bar:#0071e3; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1c1e; --fg:#f5f5f7; --muted:#a1a1a6; --line:#3a3a3c; --accent:#2997ff; --bar:#2997ff; } }
  body { margin:0; padding:24px 16px; background:var(--bg); color:var(--fg); font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  main { max-width:960px; margin:0 auto; }
  h1 { font-size:22px; margin:0 0 4px; }
  h2 { font-size:16px; margin:28px 0 8px; }
  .muted { color:var(--muted); }
  .bar-row { display:flex; gap:12px; margin:12px 0; flex-wrap:wrap; }
  button { font:inherit; padding:6px 14px; border-radius:8px; border:1px solid var(--line); background:transparent; color:var(--fg); cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--muted); font-weight:500; }
  .wrap { overflow-x:auto; }
  .hours { display:grid; grid-template-columns:repeat(24, 1fr); gap:3px; align-items:end; height:120px; margin-top:8px; }
  .hours div { background:var(--bar); border-radius:3px 3px 0 0; min-height:1px; }
  .hour-labels { display:grid; grid-template-columns:repeat(24, 1fr); gap:3px; font-size:10px; color:var(--muted); text-align:center; }
  .now { color:var(--accent); font-weight:600; }
</style>
</head>
<body>
<main>
  <h1>Restock History</h1>
  <div class="muted" id="summary">Loading…</div>
  <div class="bar-row">
    <button class="primary" id="export">Export CSV</button>
    <button id="clear">Clear history</button>
  </div>

  <h2>Restocks by hour of day</h2>
  <div class="muted">How many times something came into stock in each hour (your local time).</div>
  <div class="hours" id="hours"></div>
  <div class="hour-labels" id="hourLabels"></div>

  <h2>All restocks</h2>
  <div class="wrap"><table>
    <thead><tr><th>Store</th><th>Part</th><th>In stock from</th><th>Sold out at</th><th>Lasted</th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
</main>
<script src="history.js"></script>
</body>
</html>
